name: Build NEXO AI APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP" || { echo "Nenhum .zip encontrado na raiz do repositorio"; exit 1; }
          mkdir -p project
          unzip -q "$ZIP" -d project
          GRADLE_FILE=$(find project -name settings.gradle.kts -print -quit)
          test -n "$GRADLE_FILE" || { echo "settings.gradle.kts nao encontrado dentro do zip"; exit 1; }
          echo "ANDROID_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        run: gradle --no-daemon -p "$ANDROID_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-AI-debug-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
